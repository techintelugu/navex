
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D18">
<title>NAVEX — One Platform. Endless Possibilities.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23080D18'/%3E%3Cpath d='M9 24V8l14 16V8' fill='none' stroke='%2338CFFF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand"><svg class="logo" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38CFFF"/><stop offset="1" stop-color="#8B70FF"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="#080D18"/><path d="M9 24V8l14 16V8" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>NAVEX</span></div>
      <button class="icon-btn" id="collapseBtn" aria-label="Collapse sidebar" data-i18n-aria="collapse">‹</button>
    </div>
    <button class="new-chat" id="newChat">＋ <span data-i18n="newChat">New chat</span></button>
    <input class="search" id="search" type="search" data-i18n-ph="search" placeholder="Search conversations">
    <nav class="history" id="history" aria-label="Conversations"></nav>
    <div class="side-bottom">
      <button class="side-link" id="settingsBtn">⚙ <span data-i18n="settings">Settings</span></button>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" class="on">English</button><button data-lang="te">తెలుగు</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="tools-wrap">
        <button class="mode-btn" id="modeBtn"><span id="modeLabel">NAVEX AI</span> ▾</button>
        <div class="menu" id="toolsMenu" hidden></div>
      </div>
      <span class="demo-pill" data-i18n="demoMode">Demo mode · no AI connected</span>
    </header>

    <section class="stage" id="stage">
      <div class="welcome" id="welcome">
        <h1 data-i18n="heading">What can I help you with?</h1>
        <p data-i18n="sub">Ask anything. Learn anything. Create anything.</p>
        <div class="cards" id="cards"></div>
      </div>
      <div class="thread" id="thread" hidden></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <button class="icon-btn" id="attach" aria-label="Attach">📎</button>
        <textarea id="input" rows="1" data-i18n-ph="placeholder" placeholder="Message NAVEX..."></textarea>
        <button class="send" id="send" aria-label="Send" disabled>↑</button>
      </div>
      <small data-i18n="note">NAVEX is a front-end demo. Replies are placeholders, not real AI.</small>
    </footer>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="panel">
    <h2 data-i18n="settings">Settings</h2>
    <label><span data-i18n="language">Language</span>
      <select id="langSel"><option value="en">English</option><option value="te">తెలుగు</option></select></label>
    <label class="row"><span data-i18n="reduce">Reduce motion</span><input type="checkbox" id="reduceMotion"></label>
    <button class="danger" id="clearAll" data-i18n="clearAll">Delete all conversations</button>
    <button class="primary" id="closeModal" data-i18n="done">Done</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
  </html>
